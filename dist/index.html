<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="글로벌 MMA 대회 일정, 대진표, 개최지와 시청 정보를 한눈에." />
  <title>MMA CALENDAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="map-updates.css" /><link rel="stylesheet" href="detail-layout.css" /><link rel="stylesheet" href="wide-layout.css" /><link rel="stylesheet" href="poster.css" />
  <style>.subscribe{margin-top:16px;border:1px solid #35413d;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.subscribe div{margin-right:auto}.subscribe b{display:block;font-size:12px}.subscribe span{font-size:10px;color:#83908b}.subscribe button{border:1px solid #56615d;background:transparent;color:#dce1df;font-size:11px;padding:6px 8px;cursor:pointer}.promo-grid .korean{color:#ffe0d7;border-color:#b85239;background:#332522}.world-map{height:310px!important;background:linear-gradient(145deg,#172723,#28453d)!important;border:1px solid #607169;overflow:hidden}.world-map svg{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);fill:#7d9b8d;opacity:.72}.world-map .pin{position:absolute;z-index:2;transform:translate(-50%,-100%) rotate(-45deg);width:23px;height:23px}.world-map .map-label{z-index:3;font-weight:700}.map-caption{position:absolute;right:9px;top:8px;color:#d8e4de;letter-spacing:1px;font:600 10px 'Barlow Condensed'}.map-grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 14%,#9bb4a820 14.3%,transparent 14.6%),repeating-linear-gradient(0deg,transparent 0,transparent 24%,#9bb4a820 24.3%,transparent 24.6%)}@media(max-width:820px){.subscribe div{width:100%;margin-bottom:4px}.world-map{height:270px!important}}</style>
</head>
<body>
  <div class="ambient"></div>
  <header>
    <a class="brand" href="#top"><i></i>MMA <span>CALENDAR</span></a>
    <nav><a class="active" href="#calendar">일정</a></nav>
    <button class="language" type="button">KR <span>⌄</span></button>
  </header>
  <main id="top">
    <section class="workspace" id="calendar">
      <div class="calendar-panel">
        <div class="panel-head"><div><p class="section-kicker">EVENT CALENDAR · KST</p><h2>2026년 11월</h2><p class="timezone-note">모든 날짜와 시작 시각은 한국 표준시(KST, UTC+9) 기준입니다.</p></div><div class="month-controls"><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div></div>
        <div class="filters"><button class="filter selected" data-filter="all">전체</button><button class="filter" data-filter="major">메이저</button><button class="filter" data-filter="korea">한국</button><button class="filter" data-filter="asia">아시아</button><button class="filter" data-filter="japan">일본</button><button class="filter" data-filter="china">중국</button></div>
        <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="days" id="days"></div>
        <div class="subscribe"><div><b>내 캘린더에 MMA 일정 추가</b><span>일정 변경도 자동 동기화됩니다.</span></div><button id="googleCal">Google Calendar</button><button id="appleCal">Apple Calendar</button></div><p class="disclaimer">현재 화면은 제품 UI 시연용 편집 데이터입니다. 실제 운영 시 단체 공식 발표와 제휴 데이터로 동기화됩니다.</p>
      </div>
      <aside class="detail-panel" id="detail"></aside>
    </section>

  </main>
  <footer>MMA CALENDAR <small>대회 정보는 한국 표준시(KST) 기준으로 제공됩니다.</small></footer>
  <script src="app.js"></script><script src="detail-card.js"></script>
</body></html>
